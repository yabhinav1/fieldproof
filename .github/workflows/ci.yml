name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Route types are generated, so the type check needs them first.
      - name: Type check
        run: npx next typegen && npm run typecheck

      # Runs offline: the tests use an in-memory Postgres and no API keys.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
